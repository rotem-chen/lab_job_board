name: Build and Push Docker Images
on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out your code from the repository
      - name: Check out the repo
        uses: actions/checkout@v4

      # Step 2: Log in to Docker Hub using the configured secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 3: Set up the Docker build environment in GitHub
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 4: Build and push the API application
      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: ./applications-service
          push: true
          tags: rotemdock/jobboard-api:latest

      # Step 5: Build and push the Frontend
      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: rotemdock/jobboard-frontend:latest