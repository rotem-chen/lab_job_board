name: Build and Push Docker Images

# מתי האקשן ירוץ? בכל פעם שיש Push ל-Branch שנקרא main (או master)
on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # שלב 1: להוריד את הקוד שלך מהריפוזיטורי
      - name: Check out the repo
        uses: actions/checkout@v4

      # שלב 2: להתחבר ל-Docker Hub בעזרת הסודות שהגדרנו
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # שלב 3: להגדיר את סביבת העבודה לדוקר בגיטהאב
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # שלב 4: לבנות ולדחוף את האפליקציה (API)
      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: ./applications-service
          push: true
          tags: rotemdock/jobboard-api:latest

      # שלב 5: לבנות ולדחוף את ה-Frontend
      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: rotemdock/jobboard-frontend:latest